# Serves the built SPA and proxies the API to the Go backend, so the browser
# only ever talks to one origin (no CORS).

# Vite's hashed assets never change; index.html must be revalidated so a new
# deploy is picked up. Set here, at server level, because an add_header inside
# a location would drop the security headers below.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: unknown paths get the app.
    location / {
        try_files $uri /index.html;
    }
}
