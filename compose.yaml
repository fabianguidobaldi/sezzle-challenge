# docker compose up --build  →  http://localhost:8080
services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Not published: only reachable from nginx, as backend:8080. Its
    # healthcheck is defined in backend/Dockerfile.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
